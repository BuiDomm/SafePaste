name: Detector false positive or false negative
description: Improve a detector with safe synthetic fixtures
title: "[Detector]: "
labels: [detector]
body:
  - type: markdown
    attributes:
      value: "Use synthetic values only. If the behavior involves a real credential, rotate it and create a structurally similar non-functional fixture."
  - type: input
    id: rule
    attributes:
      label: Rule ID
      placeholder: credential.aws_access_key_id
    validations:
      required: true
  - type: dropdown
    id: behavior
    attributes:
      label: Behavior
      options:
        - False positive
        - False negative
    validations:
      required: true
  - type: textarea
    id: fixture
    attributes:
      label: Synthetic fixture and context
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm the fixture is synthetic and non-functional.
          required: true
