[workspace]
members = ["crates/core", "apps/desktop/src-tauri"]
resolver = "2"

[workspace.package]
version = "0.1.0-alpha.0"
edition = "2024"
license = "Apache-2.0"
repository = "https://github.com/placeholder/aiguard"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = true
codegen-units = 1
opt-level = "s"
strip = true
