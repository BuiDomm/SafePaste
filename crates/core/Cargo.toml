[package]
name = "aiguard-core"
version.workspace = true
edition.workspace = true
license-file = "../../LICENSE"
repository.workspace = true
description = "Pure detection and policy engine for AI Data Boundary"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
hex = "0.4"
hmac = "0.12"
regex = "1.11"
semver = "1"
serde.workspace = true
serde_json.workspace = true
sha2 = "0.10"
wasm-bindgen = "0.2"

[dev-dependencies]
pretty_assertions = "1"

[package.metadata.wasm-pack.profile.release]
wasm-opt = false
