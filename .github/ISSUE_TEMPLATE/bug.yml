name: Bug report
description: Report reproducible behavior using synthetic data only
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: "Never paste a real credential, private prompt, customer record, or personal identifier into this form."
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: 0.1.0-alpha.0
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Synthetic reproduction
      description: Provide the smallest reproduction with non-functional example data.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I confirm this report contains no real secret, prompt, or personal data.
          required: true
